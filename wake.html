<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>🌅 Wake Up Log</title>

  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" href="icon.png">

  <style>
    body {
      font-family: sans-serif;
      background: #f0f6ff;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      margin-top: 0;
    }

    .wake-button {
      font-size: 28px;
      padding: 30px;
      width: 100%;
      border-radius: 16px;
      border: none;
      background: #ffb347;
      cursor: pointer;
      margin-bottom: 20px;
    }

    button {
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    button.delete {
      background: #d9534f;
      color: white;
    }

    .box {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .log {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
    }

    /* 横並びレイアウト */
    .wake-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    /* 小さい削除ボタン */
    button.small {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    input[type="time"] {
      font-size: 14px;
    }

    /* スマホ用調整 */
    @media (max-width: 600px) {
      body {
        font-size: 17px;
      }

      h1 {
        font-size: 24px;
      }

      .wake-button {
        font-size: 32px;
        padding: 36px;
      }

      .log, .box {
        font-size: 16px;
      }

      input[type="time"] {
        font-size: 18px;
      }

      /* 👇 ここで small を上書き（重要） */
      button.small {
        font-size: 11px;
        padding: 4px 6px;
      }
    }
  </style>
</head>

<body>

<nav style="margin-bottom:20px;">
  <a href="index.html">🏠 Home</a> |
  <a href="wake.html">🌅 Wake Up Log</a>
</nav>

<h1>🌅 Wake Up Log</h1>
<p id="today"></p>

<button class="wake-button" onclick="logWake()">🌅 起きた！</button>

<div class="box" id="averageTime"></div>
<div class="box" id="monthlyAverage"></div>

<h2>📜 起床の記録</h2>
<div id="wakeList"></div>

<script>
  const TARGET_TIME = "06:00";
  const today = new Date();

  document.getElementById("today").textContent =
    "📅 " +
    today.getFullYear() + "年" +
    (today.getMonth() + 1) + "月" +
    today.getDate() + "日";

  function logWake() {
    const now = new Date();
    const entry = {
      date: now.toISOString().slice(0, 10),
      time: now.toTimeString().slice(0, 5)
    };

    const data = JSON.parse(localStorage.getItem("wakeLogs") || "[]");
    data.push(entry);
    localStorage.setItem("wakeLogs", JSON.stringify(data));
    localStorage.setItem("todayWake", JSON.stringify(entry));

    renderWakeLogs();
  }

  function deleteWake(index) {
    if (!confirm("この起床ログを削除しますか？")) return;

    const data = JSON.parse(localStorage.getItem("wakeLogs") || "[]");
    data.splice(index, 1);
    localStorage.setItem("wakeLogs", JSON.stringify(data));
    renderWakeLogs();
  }

  function updateTime(index, newTime) {
    const data = JSON.parse(localStorage.getItem("wakeLogs") || "[]");
    data[index].time = newTime;
    localStorage.setItem("wakeLogs", JSON.stringify(data));
    renderWakeLogs();
  }

  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function renderAverage(data) {
    if (data.length === 0) {
      document.getElementById("averageTime").textContent =
        "📊 平均起床時間：データなし";
      return;
    }

    const avg =
      Math.round(data.reduce((s, e) => s + timeToMinutes(e.time), 0) / data.length);

    document.getElementById("averageTime").textContent =
      `📊 平均起床時間：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
  }

  function renderMonthlyAverage(data) {
    const thisMonth = today.toISOString().slice(0, 7);
    const monthData = data.filter(d => d.date.startsWith(thisMonth));

    if (monthData.length === 0) {
      document.getElementById("monthlyAverage").textContent =
        "📈 今月の平均起床：データなし";
      return;
    }

    const avg =
      Math.round(monthData.reduce((s, e) => s + timeToMinutes(e.time), 0) / monthData.length);

    document.getElementById("monthlyAverage").textContent =
      `📈 今月の平均起床：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
  }

  function renderWakeLogs() {
    const list = document.getElementById("wakeList");
    list.innerHTML = "";

    const data = JSON.parse(localStorage.getItem("wakeLogs") || "[]");
    renderAverage(data);
    renderMonthlyAverage(data);

    if (data.length === 0) {
      list.textContent = "まだ起床ログはありません。";
      return;
    }

    const targetMin = timeToMinutes(TARGET_TIME);

    data.slice().reverse().forEach((entry, i) => {
      const realIndex = data.length - 1 - i;
      const isEarly = timeToMinutes(entry.time) <= targetMin;

      const div = document.createElement("div");
      div.className = "log";
      div.innerHTML = `
        <strong>${entry.date}</strong> ${isEarly ? "🌟" : ""}
        <div class="wake-row">
          <input type="time" value="${entry.time}"
            onblur="updateTime(${realIndex}, this.value)">
          <button class="delete small"
            onclick="deleteWake(${realIndex})">削除</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  renderWakeLogs();
</script>

</body>
</html>
