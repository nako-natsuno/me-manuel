<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌅 Wake Up Log</title>

  <link rel="icon" href="icon.png">

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f0f6ff;
      line-height: 1.6;
    }

    nav a {
      margin-right: 10px;
    }

    .wake-button {
      font-size: 28px;
      padding: 30px;
      width: 100%;
      border-radius: 16px;
      border: none;
      background: #4a90e2;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .box, .log {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .wake-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    input[type="time"] {
      font-size: 18px;
    }

    button.delete {
      background: #d9534f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

  .app-icon {
  width: 96px;
  height: 96px;
  display: block;
  margin: 0 auto 12px;
  border-radius: 20%;
}

.wake-button.disabled {
  background: #ccc;
  color: #666;
  box-shadow: none;
  cursor: default;
}

  </style>

  <!-- Firebase（Firestoreのみ） -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD68jD_vsq_IwVupHsuHOMcLDO3JGJH-qU",
      authDomain: "me-manuel.firebaseapp.com",
      projectId: "me-manuel",
      storageBucket: "me-manuel.firebasestorage.app",
      messagingSenderId: "322422156686",
      appId: "1:322422156686:web:0bd42d600451496d8e48df"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /* 🔑 index.html と完全に同じ userId */
    const userId = "me-manuel-main-user";
  </script>
</head>

<body>

<nav style="margin-bottom:20px;">
  <a href="index.html">🏠 Home</a> |
  <a href="wake.html">🌅 Wake Up Log</a>
</nav>

<img src="icon.png" alt="Me Manuel Icon" class="app-icon">

<h1>🌅 Wake Up Log</h1>
<p id="today"></p>

<button class="wake-button" id="wakeBtn">🌅 起きた！</button>

<div class="box" id="averageTime"></div>
<div class="box" id="monthlyAverage"></div>

<h2>📜 起床の記録</h2>
<div id="wakeList"></div>

<script>
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  document.getElementById("today").textContent =
    "📅 " + today.toLocaleDateString();

  const wakeRef = db
    .collection("users")
    .doc(userId)
    .collection("wakeLogs");

  let wakeCache = [];

  const wakeBtn = document.getElementById("wakeBtn");

  /* 🌅 起床ログ追加（1日1回制限） */
  async function logWake() {
    if (hasWokenToday()) return;

    // 📳 軽いバイブ（iPhone対応）
    if (navigator.vibrate) {
      navigator.vibrate(30);
    }

    const now = new Date();
    await wakeRef.add({
      date: todayStr,
      time: now.toTimeString().slice(0, 5),
      createdAt: now.toISOString()
    });
  }

  wakeBtn.addEventListener("click", logWake);

  /* 🔄 リアルタイム同期 */
  function startRealtimeWakeLogs() {
    wakeRef
      .orderBy("date")
      .onSnapshot(snapshot => {
        wakeCache = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        renderWakeLogs();
        updateWakeButtonState();
      });
  }

  /* ✅ 今日すでに起きているか */
  function hasWokenToday() {
    return wakeCache.some(e => e.date === todayStr);
  }

  /* 🎛 ボタン状態制御 */
  function updateWakeButtonState() {
    if (hasWokenToday()) {
      wakeBtn.textContent = "✅ 記録した";
      wakeBtn.classList.add("disabled");
      wakeBtn.disabled = true;
    } else {
      wakeBtn.textContent = "🌅 起きた！";
      wakeBtn.classList.remove("disabled");
      wakeBtn.disabled = false;
    }
  }

  /* 🖼 描画 */
  function renderWakeLogs() {
    const list = document.getElementById("wakeList");
    list.innerHTML = "";

    if (wakeCache.length === 0) {
      list.textContent = "まだ起床ログはありません。";
      return;
    }

    renderAverage(wakeCache);
    renderMonthlyAverage(wakeCache);

    wakeCache.slice().reverse().forEach(e => {
      const div = document.createElement("div");
      div.className = "log";
      div.innerHTML = `
        <strong>${e.date}</strong>
        <div class="wake-row">
          <input type="time" value="${e.time}"
            onchange="updateTime('${e.id}', this.value)">
          <button class="delete"
            onclick="deleteWake('${e.id}')">削除</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  /* ✏️ 更新 */
  async function updateTime(id, newTime) {
    await wakeRef.doc(id).update({ time: newTime });
  }

  /* 🗑 削除 */
  async function deleteWake(id) {
    if (!confirm("この起床ログを削除しますか？")) return;
    await wakeRef.doc(id).delete();
  }

  /* ⏱ 計算 */
  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function renderAverage(data) {
    const avg =
      Math.round(
        data.reduce((s, e) => s + timeToMinutes(e.time), 0) / data.length
      );

    document.getElementById("averageTime").textContent =
      `📊 平均起床：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
  }

  function renderMonthlyAverage(data) {
    const month = todayStr.slice(0, 7);
    const m = data.filter(e => e.date.startsWith(month));
    if (m.length === 0) return;

    const avg =
      Math.round(
        m.reduce((s, e) => s + timeToMinutes(e.time), 0) / m.length
      );

    document.getElementById("monthlyAverage").textContent =
      `📈 今月の平均：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
  }

  /* 🔥 初期化 */
  startRealtimeWakeLogs();
</script>


</body>
</html>
