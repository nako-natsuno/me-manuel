<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌅 Wake</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">

<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  padding: 20px;
  text-align: center;
}

nav {
  margin-bottom: 20px;
}

nav a {
  margin: 0 8px;
}

.app-icon {
  width: 96px;
  height: 96px;
  margin: 0 auto 12px;
  border-radius: 20%;
}

#wakeBtn {
  font-size: 20px;
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  background: #ffdf6c;
  cursor: pointer;
}

#wakeBtn.disabled {
  background: #ccc;
  color: #666;
  cursor: default;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Home</a> |
  <a href="wake.html">🌅 Wake</a> |
  <a href="goals2026.html">🎯 2026</a>
</nav>

<img src="icon.png" alt="Me Manuel Icon" class="app-icon">

<h1>🌅 Wake</h1>
<p id="today"></p>

<button id="wakeBtn">🌅 起きた！</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyD68jD_vsq_IwVupHsuHOMcLDO3JGJH-qU",
  authDomain: "me-manuel.firebaseapp.com",
  projectId: "me-manuel",
  storageBucket: "me-manuel.firebasestorage.app",
  messagingSenderId: "322422156686",
  appId: "1:322422156686:web:0bd42d600451496d8e48df"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* 👤 固定ユーザーID */
const userId = "me-manuel-main-user";

/* 起床ステータス保存先 */
const wakeStatusRef = db
  .collection("users")
  .doc(userId)
  .collection("wake")
  .doc("status");

/* ===== 日付ユーティリティ ===== */
function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

/* ===== 表示 ===== */
const today = new Date();
document.getElementById("today").textContent =
  "📅 " + today.toLocaleDateString();

/* ===== ボタン制御 ===== */
function updateWakeButton(lastWakeDate) {
  const btn = document.getElementById("wakeBtn");
  const today = todayKey();

  if (lastWakeDate === today) {
    btn.textContent = "✅ 記録した";
    btn.classList.add("disabled");
    btn.disabled = true;
  } else {
    btn.textContent = "🌅 起きた！";
    btn.classList.remove("disabled");
    btn.disabled = false;
  }
}

/* ===== Firestore 監視（超重要） ===== */
wakeStatusRef.onSnapshot(doc => {
  const data = doc.data();
  updateWakeButton(data?.wakeDate);
});

/* ===== 起床ボタン押下 ===== */
document.getElementById("wakeBtn").onclick = async () => {
  const today = todayKey();

  await wakeStatusRef.set({
    wakeDate: today,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  updateWakeButton(today);
};
</script>

</body>
</html>
