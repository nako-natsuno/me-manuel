<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌅 Wake Up Log</title>

  <link rel="icon" href="icon.png">

  <!-- Firebase（compat） -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
const firebaseConfig = {
  apiKey: "AIzaSyD68jD_vsq_IwVupHsuHOMcLDO3JGJH-qU",
  authDomain: "me-manuel.firebaseapp.com",
  projectId: "me-manuel",
  storageBucket: "me-manuel.firebasestorage.app",
  messagingSenderId: "322422156686",
  appId: "1:322422156686:web:0bd42d600451496d8e48df"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f6ff; }
    .wake-button { font-size: 28px; padding: 30px; width: 100%; border-radius: 16px; }
    .box, .log { background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
    .wake-row { display: flex; gap: 10px; align-items: center; }
    button.delete { background: #d9534f; color: white; }
  </style>
</head>

<body>

<nav style="margin-bottom:20px;">
  <a href="index.html">🏠 Home</a> |
  <a href="wake.html">🌅 Wake Up Log</a>
</nav>

<h1>🌅 Wake Up Log</h1>
<p id="today"></p>

<button class="wake-button" onclick="logWake()">🌅 起きた！</button>

<div class="box" id="averageTime"></div>
<div class="box" id="monthlyAverage"></div>

<h2>📜 起床の記録</h2>
<div id="wakeList"></div>

<script>
/* ========= 共通 userId ========= */
const USER_ID_KEY = "meManuelUserId";

function generateId() {
  return "xxxxxx-xxxxxx".replace(/x/g, () =>
    Math.floor(Math.random() * 16).toString(16)
  );
}

let userId = localStorage.getItem(USER_ID_KEY);
if (!userId) {
  userId = generateId();
  localStorage.setItem(USER_ID_KEY, userId);
}

/* ========= 日付表示 ========= */
const today = new Date();
document.getElementById("today").textContent =
  "📅 " + today.toLocaleDateString();

/* ========= Firestore参照 ========= */
const wakeRef = db
  .collection("users")
  .doc(userId)
  .collection("wakeLogs");

/* ========= 起床記録 ========= */
async function logWake() {
  const now = new Date();
  await wakeRef.add({
    date: now.toISOString().slice(0, 10),
    time: now.toTimeString().slice(0, 5),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  loadWakeLogs();
}

/* ========= 時刻変換 ========= */
function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

/* ========= 描画 ========= */
let wakeCache = [];

async function loadWakeLogs() {
  const snapshot = await wakeRef.orderBy("date").get();
  wakeCache = snapshot.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
  renderWakeLogs();
}

function renderWakeLogs() {
  const list = document.getElementById("wakeList");
  list.innerHTML = "";

  if (wakeCache.length === 0) {
    list.textContent = "まだ起床ログはありません。";
    return;
  }

  renderAverage(wakeCache);
  renderMonthlyAverage(wakeCache);

  wakeCache.slice().reverse().forEach(e => {
    const div = document.createElement("div");
    div.className = "log";
    div.innerHTML = `
      <strong>${e.date}</strong>
      <div class="wake-row">
        <input type="time" value="${e.time}"
          onchange="updateTime('${e.id}', this.value)">
        <button class="delete"
          onclick="deleteWake('${e.id}')">削除</button>
      </div>
    `;
    list.appendChild(div);
  });
}

/* ========= 更新・削除 ========= */
async function updateTime(id, newTime) {
  await wakeRef.doc(id).update({ time: newTime });
  loadWakeLogs();
}

async function deleteWake(id) {
  if (!confirm("この起床ログを削除しますか？")) return;
  await wakeRef.doc(id).delete();
  loadWakeLogs();
}

/* ========= 平均 ========= */
function renderAverage(data) {
  const avg =
    Math.round(data.reduce((s, e) => s + timeToMinutes(e.time), 0) / data.length);

  document.getElementById("averageTime").textContent =
    `📊 平均起床：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
}

function renderMonthlyAverage(data) {
  const month = today.toISOString().slice(0, 7);
  const m = data.filter(e => e.date.startsWith(month));
  if (m.length === 0) return;

  const avg =
    Math.round(m.reduce((s, e) => s + timeToMinutes(e.time), 0) / m.length);

  document.getElementById("monthlyAverage").textContent =
    `📈 今月の平均：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
}

/* ========= 初期読み込み ========= */
loadWakeLogs();
</script>

</body>
</html>
