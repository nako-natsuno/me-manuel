<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌅 Wake</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">

<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  padding: 20px;
}

nav {
  margin-bottom: 20px;
}

nav a {
  margin-right: 10px;
}

.app-icon {
  width: 96px;
  height: 96px;
  display: block;
  margin: 0 auto 12px;
  border-radius: 20%;
}

#wakeBtn {
  display: block;
  margin: 0 auto 16px;
  font-size: 20px;
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  background: #ffdf6c;
  cursor: pointer;
}

#wakeBtn.disabled {
  background: #ccc;
  color: #666;
  cursor: default;
}

.log {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
}

.wake-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.delete {
  background: #f5a3a3;
  border: none;
  border-radius: 6px;
  padding: 4px 8px;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Home</a> |
  <a href="wake.html">🌅 Wake</a> |
  <a href="goals2026.html">🎯 2026</a>
</nav>

<img src="icon.png" alt="Me Manuel Icon" class="app-icon">

<h1>🌅 Wake</h1>
<p id="today"></p>

<button id="wakeBtn">🌅 起きた！</button>

<div id="averageTime"></div>
<div id="monthlyAverage"></div>

<div id="wakeList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyD68jD_vsq_IwVupHsuHOMcLDO3JGJH-qU",
  authDomain: "me-manuel.firebaseapp.com",
  projectId: "me-manuel",
  storageBucket: "me-manuel.firebasestorage.app",
  messagingSenderId: "322422156686",
  appId: "1:322422156686:web:0bd42d600451496d8e48df"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const userId = "me-manuel-main-user";

/* ===== 日付ユーティリティ（★ここが重要） ===== */
function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

/* ===== 表示用 ===== */
document.getElementById("today").textContent =
  "📅 " + new Date().toLocaleDateString();

/* ===== Firestore参照 ===== */
const wakeRef = db
  .collection("users")
  .doc(userId)
  .collection("wakeLogs");

let wakeCache = [];

/* ===== 起床ログ追加 ===== */
async function logWake() {
  if (hasWokenToday()) return;

  const now = new Date();
  await wakeRef.add({
    date: getTodayStr(),
    time: now.toTimeString().slice(0, 5),
    createdAt: now.toISOString()
  });
}

/* ===== 今日押せるか判定 ===== */
function hasWokenToday() {
  const today = getTodayStr();
  return wakeCache.some(e => e.date === today);
}

/* ===== ボタン状態更新 ===== */
function updateWakeButton() {
  const btn = document.getElementById("wakeBtn");

  if (hasWokenToday()) {
    btn.textContent = "✅ 記録した";
    btn.classList.add("disabled");
    btn.disabled = true;
  } else {
    btn.textContent = "🌅 起きた！";
    btn.classList.remove("disabled");
    btn.disabled = false;
  }
}

document.getElementById("wakeBtn")
  .addEventListener("click", logWake);

/* ===== リアルタイム同期 ===== */
function startRealtimeWakeLogs() {
  wakeRef
    .orderBy("date")
    .onSnapshot(snapshot => {
      wakeCache = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      renderWakeLogs();
      updateWakeButton();
    });
}

/* ===== 描画 ===== */
function renderWakeLogs() {
  const list = document.getElementById("wakeList");
  list.innerHTML = "";

  if (wakeCache.length === 0) {
    list.textContent = "まだ起床ログはありません。";
    return;
  }

  renderAverage(wakeCache);
  renderMonthlyAverage(wakeCache);

  wakeCache.slice().reverse().forEach(e => {
    const div = document.createElement("div");
    div.className = "log";
    div.innerHTML = `
      <strong>${e.date}</strong>
      <div class="wake-row">
        <input type="time" value="${e.time}"
          onchange="updateTime('${e.id}', this.value)">
        <button class="delete"
          onclick="deleteWake('${e.id}')">削除</button>
      </div>
    `;
    list.appendChild(div);
  });
}

/* ===== 更新 ===== */
async function updateTime(id, newTime) {
  await wakeRef.doc(id).update({ time: newTime });
}

/* ===== 削除 ===== */
async function deleteWake(id) {
  if (!confirm("この起床ログを削除しますか？")) return;
  await wakeRef.doc(id).delete();
}

/* ===== 平均計算 ===== */
function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function renderAverage(data) {
  const avg =
    Math.round(
      data.reduce((s, e) => s + timeToMinutes(e.time), 0) / data.length
    );

  document.getElementById("averageTime").textContent =
    `📊 平均起床：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
}

function renderMonthlyAverage(data) {
  const month = getTodayStr().slice(0, 7);
  const m = data.filter(e => e.date.startsWith(month));
  if (m.length === 0) return;

  const avg =
    Math.round(
      m.reduce((s, e) => s + timeToMinutes(e.time), 0) / m.length
    );

  document.getElementById("monthlyAverage").textContent =
    `📈 今月の平均：${String(Math.floor(avg / 60)).padStart(2, "0")}:${String(avg % 60).padStart(2, "0")}`;
}

/* ===== 初期化 ===== */
startRealtimeWakeLogs();
</script>

</body>
</html>
