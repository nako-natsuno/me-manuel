<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🎯 2026年の指針</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">

<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  padding: 20px;
  line-height: 1.7;
}
nav a { margin-right: 10px; }

section {
  background: #fff;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 16px;
}

.goal-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  margin: 12px 0;
  background: #fafafa;
}

.goal-card strong {
  display: block;
  margin-bottom: 6px;
}

.goal-card textarea,
.goal-card select,
.goal-card input[type="date"] {
  width: 100%;
  margin-top: 4px;
  padding: 6px;
  font-size: 14px;
}

.month-highlight textarea {
  width: 100%;
  min-height: 60px;
  margin-top: 6px;
}

.note {
  font-size: 14px;
  color: #666;
}

details {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 16px;
}

summary {
  font-weight: bold;
  cursor: pointer;
}

</style>
</head>

<body>

<nav>
  <a href="wake.html">🌅 Wake</a> |
  <a href="index.html">📝 Log</a> |
  <a href="goals2026.html">🎯 2026</a>
</nav>

<h1>🎯 2026年の指針</h1>

<section>
  <strong>2026年のテーマ</strong><br>
  整える・積み上げる・表現する
</section>

<section class="note">
  ここは進捗を測る場所ではない。<br>
  意識を戻すための場所。
</section>

<!-- 🌕 月間ハイライト -->
<section>
  <h2>🌕 月間ハイライト</h2>
  <div id="monthlyHighlights"></div>
</section>

<!-- 🎯 目標カード -->
<section>
  <h2>📦 目標カード</h2>
  <div id="goalContainer"></div>
</section>

<!-- ================= Firebase ================= -->

<!-- Firebase SDK（先に読み込む） -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== Firebase 初期化（1回だけ） ===== */
const firebaseConfig = {
  apiKey: "AIzaSyD68jD_vsq_IwVupHsuHOMcLDO3JGJH-qU",
  authDomain: "me-manuel.firebaseapp.com",
  projectId: "me-manuel",
  storageBucket: "me-manuel.firebasestorage.app",
  messagingSenderId: "322422156686",
  appId: "1:322422156686:web:0bd42d600451496d8e48df"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== ユーザーID（固定） ===== */
const userId = "me-manuel-main-user";

/* ===== Firestore参照 ===== */
const goalRef = db.collection("users").doc(userId).collection("goals");
const highlightRef = db.collection("users").doc(userId).collection("highlights");

/* ===== 目標定義（全件） ===== */
const goals = [
  // 🍽 生活
  { id:"beer", title:"1年間ビール禁止", group:"🍽 生活" },
  { id:"pasta", title:"1年間パスタ禁止", group:"🍽 生活" },
  { id:"natto", title:"迷ったら納豆ご飯＋味噌汁", group:"🍽 生活" },
  { id:"cold_move", title:"寒くなったら体を動かす", group:"🍽 生活" },

  // 💪 健康
  { id:"weight", title:"ベストコンディション体型48kg", group:"💪 健康" },
  { id:"no_cross", title:"脚を組まない", group:"💪 健康" },
  { id:"sweat", title:"汗をかく", group:"💪 健康" },
  { id:"facepack", title:"フェイスパックを習慣化", group:"💪 健康" },
  { id:"early", title:"早起き", group:"💪 健康" },

  // 💰 お金
  { id:"asset", title:"資産400万円", group:"💰 お金" },
  { id:"side", title:"副業で年間5万円", group:"💰 お金" },
  { id:"ai", title:"AIでお金を稼ぐ", group:"💰 お金" },
  { id:"stock", title:"個別株投資を始める", group:"💰 お金" },
  { id:"fp", title:"FP2級合格", group:"💰 お金" },

  // 📚 学び
  { id:"read50", title:"年間読書50冊", group:"📚 学び" },
  { id:"reader_app", title:"読書通帳アプリを作る", group:"📚 学び" },
  { id:"news", title:"ニュースチェック習慣化", group:"📚 学び" },
  { id:"memo", title:"メモを取る", group:"📚 学び" },
  { id:"memory", title:"記憶力を高める", group:"📚 学び" },
  { id:"toeic", title:"TOEIC700点", group:"📚 学び" },
  { id:"english", title:"英語で道案内できる", group:"📚 学び" },

  // ✍️ 表現
  { id:"diary", title:"日記・記録を習慣化", group:"✍️ 表現" },
  { id:"sns", title:"SNS/note発信をものにする", group:"✍️ 表現" },
  { id:"manual", title:"自分の取説を作る", group:"✍️ 表現" },
  { id:"mood", title:"自分の機嫌を自分で取る", group:"✍️ 表現" },
  { id:"like", title:"好きなものをすぐ言える", group:"✍️ 表現" },

  // 🤝 人
  { id:"friend", title:"趣味の友達をつくる", group:"🤝 人" }
];


/* ===== 月間ハイライト描画 ===== */
const mh = document.getElementById("monthlyHighlights");

for (let m = 1; m <= 12; m++) {
  mh.innerHTML += `
    <div class="month-highlight">
      <strong>${m}月</strong>
      <textarea data-month="${m}"></textarea>
    </div>
  `;
}

mh.addEventListener("input", e => {
  const m = e.target.dataset.month;
  if (!m) return;
  highlightRef.doc(m).set({
    text: e.target.value,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
});

/* ===== 目標カード描画 ===== */
const container = document.getElementById("goalContainer");

// ジャンルごとにまとめる
const grouped = {};
goals.forEach(g => {
  if (!grouped[g.group]) grouped[g.group] = [];
  grouped[g.group].push(g);
});

// 描画
Object.keys(grouped).forEach(group => {
  const details = document.createElement("details");
  details.open = true;

  const summary = document.createElement("summary");
  summary.textContent = group;
  details.appendChild(summary);

  grouped[group].forEach(g => {
    const div = document.createElement("div");
    div.className = "goal-card";
    div.innerHTML = `
      <strong>${g.title}</strong>
      <select>
        <option>意識中</option>
        <option>進行中</option>
        <option>一時停止</option>
        <option>達成</option>
      </select>
      <textarea placeholder="メモ"></textarea>
      <input type="date">
    `;

    const [sel, ta, dt] = div.querySelectorAll("select, textarea, input");

    const save = () => {
      goalRef.doc(g.id).set({
        state: sel.value,
        memo: ta.value,
        date: dt.value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    };

    sel.onchange = ta.oninput = dt.onchange = save;

    details.appendChild(div);
  });

  container.appendChild(details);
});

</script>

</body>
</html>
