<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎯 2026年の指針</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">

<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  padding: 20px;
  line-height: 1.7;
}

nav a { margin-right: 10px; }

section, details {
  background: #fff;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 16px;
}

summary {
  font-weight: bold;
  cursor: pointer;
}

.goal-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
  background: #fafafa;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-weight: bold;
  min-width: 160px;
}

.state-select {
  font-size: 13px;
}

.memo-preview {
  font-size: 14px;
  margin: 4px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stamp-gauge {
  display: flex;
  gap: 4px;
}

.stamp-cell {
  text-align: center;
  font-size: 11px;
  padding: 2px 4px;
  border-radius: 6px;
}

.stamp-cell.done {
  background: #d4f7dc;
}

.stamp {
  font-size: 18px;
  display: block;
}

.edit-mode {
  display: none;
  margin-top: 8px;
}

button {
  padding: 4px 8px;
  font-size: 13px;
}

.month-highlight textarea {
  width: 100%;
  min-height: 60px;
  margin-top: 6px;
}

.note {
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<nav>
  <a href="wake.html">🌅 Wake</a> |
  <a href="index.html">📝 Log</a> |
  <a href="goals2026.html">🎯 2026</a>
</nav>

<h1>🎯 2026年の指針</h1>

<section>
  <strong>2026年のテーマ</strong><br>
  整える・積み上げる・表現する
</section>

<section class="note">
  ここは進捗を管理する場所ではない。<br>
  自分の向きを思い出すための場所。
</section>

<section>
  <h2>📦 目標カード</h2>
  <div id="goalContainer"></div>
</section>

<!-- 🌕 月間ハイライト -->
<details>
  <summary>🌕 月間ハイライト</summary>
  <div id="monthlyHighlights"></div>
</details>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyD68jD_vsq_IwVupHsuHOMcLDO3JGJH-qU",
  authDomain: "me-manuel.firebaseapp.com",
  projectId: "me-manuel",
  storageBucket: "me-manuel.firebasestorage.app",
  messagingSenderId: "322422156686",
  appId: "1:322422156686:web:0bd42d600451496d8e48df"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const userId = "me-manuel-main-user";

const goalRef = db.collection("users").doc(userId).collection("goals");
const highlightRef = db.collection("users").doc(userId).collection("highlights");

/* ===== 目標定義 ===== */
const goals = [
  { id:"beer", title:"1年間ビール禁止", group:"🍽 生活" },
  { id:"pasta", title:"1年間パスタ禁止", group:"🍽 生活" },
  { id:"natto", title:"迷ったら納豆ご飯＋味噌汁", group:"🍽 生活" },
  { id:"cold", title:"寒くなったら体を動かす", group:"🍽 生活" },

  { id:"weight", title:"ベスト体型48kg", group:"💪 健康" },
  { id:"posture", title:"脚を組まない", group:"💪 健康" },
  { id:"sweat", title:"汗をかく", group:"💪 健康" },
  { id:"face", title:"フェイスパック習慣", group:"💪 健康" },
  { id:"early", title:"早起き", group:"💪 健康" },

  { id:"asset", title:"資産400万円", group:"💰 お金" },
  { id:"side", title:"副業5万円", group:"💰 お金" },
  { id:"ai", title:"AIで稼ぐ", group:"💰 お金" },
  { id:"stock", title:"個別株投資", group:"💰 お金" },
  { id:"fp", title:"FP2級合格", group:"💰 お金" },

  { id:"read", title:"年間読書50冊", group:"📚 学び" },
  { id:"news", title:"ニュース習慣", group:"📚 学び" },
  { id:"memo", title:"メモ習慣", group:"📚 学び" },
  { id:"memory", title:"記憶力UP", group:"📚 学び" },
  { id:"toeic", title:"TOEIC700", group:"📚 学び" },

  { id:"diary", title:"日記習慣", group:"✍️ 表現" },
  { id:"sns", title:"SNS発信", group:"✍️ 表現" },
  { id:"manual", title:"自分の取説", group:"✍️ 表現" },
  { id:"mood", title:"自分の機嫌を取る", group:"✍️ 表現" },

  { id:"friend", title:"趣味の友達", group:"🤝 人" }
];

/* ===== 月間ハイライト ===== */
const mh = document.getElementById("monthlyHighlights");

for (let m = 1; m <= 12; m++) {
  mh.innerHTML += `
    <div class="month-highlight">
      <strong>${m}月</strong>
      <textarea data-month="${m}"></textarea>
    </div>
  `;
}

highlightRef.onSnapshot(snapshot => {
  snapshot.forEach(doc => {
    const ta = mh.querySelector(`[data-month="${doc.id}"]`);
    if (ta) ta.value = doc.data().text || "";
  });
});

mh.addEventListener("input", e => {
  const m = e.target.dataset.month;
  if (!m) return;
  highlightRef.doc(m).set({
    text: e.target.value,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
});

/* ===== スタンプ ===== */
function currentMonthKey() {
  const now = new Date();
  return {
    key: `2026-${String(now.getMonth()+1).padStart(2,"0")}`,
    date: now.toISOString().slice(0,10)
  };
}

function renderStamps(stamps = {}) {
  let html = "";
  for (let m = 1; m <= 12; m++) {
    const key = `2026-${String(m).padStart(2,"0")}`;
    const stamp = stamps[key] || "▫️";
    const done = stamp === "🎉" ? "done" : "";
    html += `
      <div class="stamp-cell ${done}">
        ${m}月
        <span class="stamp">${stamp}</span>
      </div>
    `;
  }
  return html;
}

/* ===== 目標カード ===== */
let goalCache = {};
const container = document.getElementById("goalContainer");

goalRef.onSnapshot(snapshot => {
  goalCache = {};
  snapshot.forEach(doc => goalCache[doc.id] = doc.data());
  renderGoals();
});

function renderGoals() {
  container.innerHTML = "";

  const grouped = {};
  goals.forEach(g => {
    if (!grouped[g.group]) grouped[g.group] = [];
    grouped[g.group].push(g);
  });

  Object.keys(grouped).forEach(group => {
    const details = document.createElement("details");
    details.open = true;

    const summary = document.createElement("summary");
    summary.textContent = group;
    details.appendChild(summary);

    grouped[group].forEach(g => {
      const d = goalCache[g.id] || {};
      const { key, date } = currentMonthKey();

      const card = document.createElement("div");
      card.className = "goal-card";

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">${g.title}</div>

          <div class="stamp-gauge">
            ${renderStamps(d.stamps)}
          </div>

          <select class="state-select">
            <option ${d.state==="意識中"?"selected":""}>意識中</option>
            <option ${d.state==="進行中"?"selected":""}>進行中</option>
            <option ${d.state==="一時停止"?"selected":""}>一時停止</option>
            <option ${d.state==="達成"?"selected":""}>達成</option>
          </select>

          <button class="edit-btn">メモ</button>
        </div>

        <div class="memo-preview">
          ${(d.memo || "").length > 60 ? d.memo.slice(0,60)+"…" : (d.memo || "")}
        </div>

        ${d.achievedAt ? `🎉 達成日：${d.achievedAt}` : ""}

        <div class="edit-mode">
          <textarea>${d.memo || ""}</textarea>
          <button class="save-btn">保存</button>
        </div>
      `;

      const stateSelect = card.querySelector(".state-select");
      const editBtn = card.querySelector(".edit-btn");
      const editMode = card.querySelector(".edit-mode");
      const saveBtn = card.querySelector(".save-btn");
      const memoTa = card.querySelector("textarea");
      const stampCells = card.querySelectorAll(".stamp-cell");

      stateSelect.onchange = () => {
        goalRef.doc(g.id).set({
          ...d,
          state: stateSelect.value,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      };

      stampCells.forEach(cell => {
        cell.onclick = () => {
          const stamp = prompt("😆 / ⛔️ / 🎉 のどれかを入力", "😆");
          if (!stamp) return;

          const newData = {
            ...d,
            stamps: { ...(d.stamps || {}), [key]: stamp },
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          if (stamp === "🎉") {
            newData.achievedAt = date;
            newData.state = "達成";
          }

          goalRef.doc(g.id).set(newData);
        };
      });

      editBtn.onclick = () => {
        editMode.style.display = editMode.style.display === "block" ? "none" : "block";
      };

      saveBtn.onclick = () => {
        goalRef.doc(g.id).set({
          ...d,
          memo: memoTa.value,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      };

      details.appendChild(card);
    });

    container.appendChild(details);
  });
}
</script>

</body>
</html>
